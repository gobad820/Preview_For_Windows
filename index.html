<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Preview</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app" data-status="empty">
      <nav id="menubar" class="menubar" aria-label="Menu bar" data-i18n-label="menu.bar" hidden></nav>
      <header id="toolbar" class="toolbar"></header>
      <div id="markupbar" class="markupbar" hidden></div>
      <div class="body">
        <aside id="sidebar" class="sidebar" hidden></aside>
        <main id="viewer" class="viewer" tabindex="0">
          <div class="loading-state" role="status"><span class="spinner" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(0 12 12)" opacity="1"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(45 12 12)" opacity=".22"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(90 12 12)" opacity=".3"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(135 12 12)" opacity=".4"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(180 12 12)" opacity=".52"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(225 12 12)" opacity=".64"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(270 12 12)" opacity=".76"/><rect x="11" y="2" width="2" height="6" rx="1" transform="rotate(315 12 12)" opacity=".88"/></svg></span><span data-i18n="chrome.loading">Opening…</span></div>
          <section class="empty-state">
            <img class="empty-splash" src="/src/assets/splash.jpg" alt="" aria-hidden="true" draggable="false" />
            <h1 data-i18n="chrome.empty.title">Open a PDF</h1>
            <p><button type="button" class="btn primary" data-action="open" data-i18n="chrome.empty.open">Open…</button></p>
            <p class="hint"><span data-i18n="chrome.empty.hint">or drop a file here</span> &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>O</kbd></p>
          </section>
        </main>
      </div>
      <div class="drop-overlay" hidden><span data-i18n="chrome.dropToOpen">Drop to open</span></div>
      <div class="error-banner" role="alert" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
