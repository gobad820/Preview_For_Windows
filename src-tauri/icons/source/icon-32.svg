<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4675d"/>
      <stop offset="0.45" stop-color="#d81f1f"/>
      <stop offset="1" stop-color="#93080e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9c9d2"/>
      <stop offset="1" stop-color="#9c9cab"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="url(#tile)" stroke="#5c0006" stroke-width="1"/>
  <path d="M2.5 8 Q 2.5 2.5 8 2.5 H 24 Q 29.5 2.5 29.5 8 V 13 Q 16 16.5 2.5 13 Z" fill="url(#gloss)"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5" fill="none" stroke="#ff9a8f" stroke-opacity="0.55" stroke-width="1"/>
  <!-- ribbon shadow -->
  <g transform="translate(0.9 1.1)" fill="none" stroke="#6a0008" stroke-opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 25.5 Q 11 26 11.2 22 V 9.5 Q 11.2 7 14 7 H 18 Q 23.5 7 23.5 12 Q 23.5 16.8 18 16.8 H 14.5" stroke-width="4"/>
  </g>
  <!-- the ribbon: front side white, the turned-over part of the bowl shows its grey back -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 25.5 Q 11 26 11.2 22 V 9.5 Q 11.2 7 14 7 H 18 Q 23.5 7 23.5 12" stroke="#ffffff" stroke-width="4"/>
    <path d="M23.5 12 Q 23.5 16.8 18 16.8 H 14.5" stroke="url(#back)" stroke-width="4"/>
