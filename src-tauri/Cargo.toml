[package]
name = "preview"
version = "0.3.0"
description = "A fast, clean PDF viewer for Windows"
authors = ["Sanghae"]
edition = "2021"

[lib]
name = "preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
clipboard-win = "5"
windows-version = "0.1"
